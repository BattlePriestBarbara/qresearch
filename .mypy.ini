[mypy]
# =====================================================================================
# Strict static typing for the qresearch package (PROJECT_SPEC.md 5.2, task INF-02).
#
# Tensor-shape and Index-shape errors are silent at runtime and catastrophic in a statistical
# pipeline; mypy is therefore a mandatory gate, not an advisory check.
#
# Run:  D:\Anaconda3\python.exe -m mypy --config-file .mypy.ini
# =====================================================================================
python_version = 3.12
files = src/qresearch
exclude = (?x)(
      ^build/
    | ^dist/
    | ^artifacts/
    | ^\.venv/
  )

# --- strictness -----------------------------------------------------------------------
strict = True
warn_unreachable = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
no_implicit_optional = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

# --- reporting ------------------------------------------------------------------------
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True
error_summary = True

# --- third-party policy ---------------------------------------------------------------
# Libraries shipping a PEP 561 marker are analysed normally (numpy, cvxpy, lightgbm,
# matplotlib, mlflow, torch).  Libraries without a marker are declared per-module below:
# this keeps the codebase itself under full strict checking, instead of weakening the whole
# project with a global --ignore-missing-imports.
#
# NOTE: installing third-party stub packages (pandas-stubs, scipy-stubs) was evaluated and
# REJECTED: the current releases of those stubs require a newer numpy than the pinned
# 1.26.4 and silently upgraded it, violating the float-critical version contract of
# PROJECT_SPEC.md 3.1.  Per-module overrides are the drift-free alternative.
ignore_missing_imports = False

[mypy-qlib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True
