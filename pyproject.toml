[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qresearch"
version = "0.1.0"
description = "Temporal-neural Alpha factor mining on Qlib under strict statistical inference"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = "==3.12.*"          # exact patch level is enforced at runtime by qresearch.env
authors = [{ name = "Quantitative Research Architecture" }]
keywords = ["quantitative-finance", "alpha", "qlib", "newey-west", "student-t"]

# Direct runtime dependencies, mirrored 1:1 with requirements.txt (full patch pins only).
dependencies = [
  "pyqlib==0.9.7",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.2",
  "statsmodels==0.14.2",
  "torch==2.8.0",
  "cvxpy==1.9.1",
  "mlflow==3.2.0",
  "lightgbm==4.6.0",
  "matplotlib==3.8.4",
  "scikit-learn==1.5.1",
  "PyYAML==6.0.1",
  "pyarrow==21.0.0",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "isort==5.13.2",
  "flake8==7.0.0",
  "pylint==2.16.2",
  "mypy==1.11.2",
  "pytest==7.4.4",
  "pytest-mock==3.15.1",
  "nbconvert==7.16.4",
]

[project.scripts]
qresearch-check-env = "qresearch.env:main"

# ---------------------------------------------------------------------------------------
# src-layout: packages are discovered ONLY under src/, so `import qresearch` in tests and
# tools resolves through the installed distribution, never through the working directory.
# ---------------------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["qresearch*"]

[tool.setuptools.package-data]
qresearch = ["py.typed", "config/*.yaml"]

# ---------------------------------------------------------------------------------------
# black / isort: line length 120 matches the Qlib upstream convention (infra INF-02)
# ---------------------------------------------------------------------------------------
[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
  | artifacts
)/
'''

[tool.isort]
# Must stay consistent with ruff's `I` rules, which implement the black profile with the
# default section ordering. `force_sort_within_sections` is deliberately NOT set: it makes
# isort and ruff disagree, which turns the gate into a fight between two tools.
profile = "black"
line_length = 120
src_paths = ["src", "tests", "scripts"]

[tool.ruff.lint.isort]
known-first-party = ["qresearch"]

# ---------------------------------------------------------------------------------------
# ruff: optional accelerator (see README). Kept in sync with the flake8 selection so the
# gate result is identical whichever tool runs it.
# ---------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]           # line length is owned by black
fixable = ["I", "F401", "W291", "W293"]

# ---------------------------------------------------------------------------------------
# pytest: tests import the INSTALLED package (src-layout), never a local shadow copy.
# ---------------------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
# mypy 1.11 cannot parse PEP 695 `type X = ...` aliases, so the TypeAlias form is mandatory here.
"src/qresearch/utils/typing.py" = ["UP040"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, isolated unit tests",
  "integration: exercises Qlib handlers, datasets or the backtester",
  "statistical: validates estimator size or power; slower by design",
  "slow: excluded from the default pre-commit gate",
]
filterwarnings = ["error::DeprecationWarning:qresearch.*"]
