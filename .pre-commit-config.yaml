# =====================================================================================
# Pre-commit quality gate (task INF-02).
#
# DESIGN DECISION - why local `language: system` hooks that call scripts/hook_runner.py:
#   * mypy MUST run inside the pinned environment, because it needs the real stubs and
#     modules (qlib, torch, pandas) to type-check the project.  An isolated hook
#     environment would either fail on imports or force a global ignore-missing-imports,
#     which is exactly the weakening this gate exists to prevent.
#   * The interpreter is NOT written into this file (ADR-005): a literal path works on one
#     machine only.  Every hook calls `python scripts/hook_runner.py -m <tool>`, where the
#     bare `python` only has to reach a stdlib-only bootstrap that then re-executes the tool
#     with the pinned interpreter (QRESEARCH_PYTHON -> %CONDA_PREFIX% -> the running one).
#     On this machine the default `python` on PATH is an MSYS2 build without the quant
#     stack, which is precisely why the runner must never fall back to it.
#   * Hook tool versions are pinned in requirements-dev.txt, so gate results are
#     reproducible instead of floating with a remote hook revision.
#
# Fast gate (runs on every commit): hygiene hooks, black, isort, ruff, mypy, nbstripout.
# Slow gate (manual / CI):          pylint, pytest.
# Pre-push gate:                    scripts/prepublish_audit.py (absolute paths, data isolation,
#                                   secrets) - the machine-checkable half of the pre-publish review
#                                   recorded in docs/audits/PRE-PUBLISH-AUDIT.md.
#
# Install:
#     pre-commit install
# Run everything once:
#     pre-commit run --all-files
# Run the slow gate:
#     pre-commit run --all-files --hook-stage manual
# =====================================================================================
# NOTE: `default_language_version` is deliberately NOT set.
# Setting it to an interpreter PATH (e.g. "<conda>/python.exe") breaks pre-commit on
# Windows: the value is embedded in the hook virtualenv directory name, and the ':' of the
# drive letter is an invalid filename character ('py_env-D:'). The interpreter is instead
# resolved at run time by scripts/hook_runner.py (see ADR-005).
#
# NOTE: hook entry paths use FORWARD SLASHES on purpose. pre-commit splits `entry` with a
# POSIX shlex, which treats a backslash as an escape character, so a Windows separator in an
# entry silently becomes an unescapable path and every hook fails with "Executable not
# found". Forward slashes are accepted by CreateProcess on Windows and survive shlex.

fail_fast: false

repos:
  # -----------------------------------------------------------------------------------
  # File hygiene
  # -----------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=crlf"]
      - id: debug-statements
      - id: forbid-submodules

  # -----------------------------------------------------------------------------------
  # Formatters (must run before linters) - versions pinned in requirements-dev.txt
  # -----------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: black
        name: black (line length 120, Qlib convention)
        entry: python scripts/hook_runner.py -m black
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: ["--line-length=120"]

      - id: isort
        name: isort (profile black, line length 120)
        entry: python scripts/hook_runner.py -m isort
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: ["--settings-path=pyproject.toml"]

  # -----------------------------------------------------------------------------------
  # Static analysis
  # -----------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff
        name: ruff (fast lint; unused names, dead code, import order)
        entry: python scripts/hook_runner.py -m ruff check
        language: system
        types_or: [python, pyi]
        args: ["--config=pyproject.toml", "--fix", "--exit-non-zero-on-fix"]

      - id: flake8
        name: flake8 (upstream-Qlib-compatible rules; config in .flake8)
        entry: python scripts/hook_runner.py -m flake8
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict; tensor and Index shape safety)
        entry: python scripts/hook_runner.py -m mypy
        language: system
        types: [python]
        files: ^src/qresearch/
        args: ["--config-file=.mypy.ini"]
        pass_filenames: false
        require_serial: true

  # -----------------------------------------------------------------------------------
  # Notebook hygiene: outputs must never reach a commit (large DataFrames, model dumps)
  # -----------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout (strip notebook outputs and execution counts)
        entry: python scripts/hook_runner.py -m nbstripout
        language: system
        files: \.ipynb$
        exclude: ^artifacts/
        require_serial: true

  # -----------------------------------------------------------------------------------
  # Pre-publish gate: refuses a push that would expose a local path, market data, model
  # weights or a credential. Rules and severity levels are documented in
  # scripts/prepublish_audit.py; the review it reproduces is docs/audits/PRE-PUBLISH-AUDIT.md.
  # Bare `python` is acceptable *here* (unlike the mypy hook): the script is stdlib-only and
  # needs no part of the pinned numerical stack.
  # -----------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prepublish-audit
        name: pre-publish audit (absolute paths, data isolation, secrets)
        entry: python scripts/prepublish_audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # -----------------------------------------------------------------------------------
  # Slow gate: manual / CI only
  # -----------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pylint
        name: pylint (semantic gate, score >= 9.0)
        entry: python scripts/hook_runner.py -m pylint
        language: system
        types: [python]
        files: ^src/qresearch/
        args: ["--rcfile=.pylintrc", "--fail-under=9.0"]
        stages: [manual]

      - id: pytest
        name: pytest (unit + leakage + statistical validation suites)
        entry: python scripts/hook_runner.py -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        args: ["-q", "-m", "not slow"]
